[project]
name = "tl-ebook"
version = "0.1.0"
description = "High-fidelity e-book translation pipeline and EPUB builder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "ebooklib>=0.18",
    "jinja2>=3.1.4",
    "pypdf>=5.1.0",
    "rich>=13.9.4",
]

[project.scripts]
tl-ebook = "tl_ebook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
